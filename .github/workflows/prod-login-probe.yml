name: Temporary production login probe

on:
  push:
    branches:
      - "fix/restore-github-auth-ci"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production login
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://cordyceps.tdamiao.com/login -o /tmp/login.html
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/login.html').read_text(errors='replace')
          print('github_login=' + str('Continuar com GitHub' in html).lower())
          print('admin_token_login=' + str('ADMIN_TOKEN' in html).lower())
          if 'Continuar com GitHub' not in html:
              raise SystemExit('Production does not expose the restored GitHub login yet')
          PY
