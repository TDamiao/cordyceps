name: Temporary Black formatter

on:
  push:
    branches: [fix/restore-github-auth-ci]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply Black 26.5.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-github-auth-ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install formatter
        run: python -m pip install "black==26.5.1"
      - name: Apply Black
        run: black src/ tests/
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ tests/
          git commit -m "style: apply Black 26.5.1"
          git push origin HEAD:fix/restore-github-auth-ci
