<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Cordyceps fungus silhouette: stalk + fruiting body -->
  <defs>
    <linearGradient id="g" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
  </defs>
  <!-- Stalk -->
  <rect x="14" y="14" width="4" height="16" rx="2" fill="url(#g)"/>
  <!-- Fruiting body (cap) -->
  <ellipse cx="16" cy="12" rx="7" ry="8" fill="url(#g)"/>
  <!-- Spore dots -->
  <circle cx="13" cy="9" r="1.2" fill="#d8f3dc" opacity="0.8"/>
  <circle cx="17" cy="11" r="1.0" fill="#d8f3dc" opacity="0.6"/>
  <circle cx="15" cy="13" r="0.8" fill="#d8f3dc" opacity="0.5"/>
</svg>
